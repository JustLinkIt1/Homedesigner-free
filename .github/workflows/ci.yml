name: CI

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: tests/points, point-routes, hd-events and render use node:sqlite (Node 22.5+).
          node-version: 22
          cache: npm
      - run: npm ci
      # tests/point-routes bundles the design-sync worker, which needs its own dependencies (jose).
      - run: npm ci --prefix workers/design-sync
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Deterministic test suites (PR gate)
        run: npm run test:ci
