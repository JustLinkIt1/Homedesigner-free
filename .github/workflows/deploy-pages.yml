name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/home-design-app-2d-plans-12y5u5
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Gate the deploy on the same checks CI runs — a red check must not ship.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Assemble the published site: marketing landing page at the root,
      # the full designer app under /app/ (its relative base './' makes it
      # path-agnostic), and privacy.html + CNAME kept at the root so the
      # Play-listing privacy URL and the custom domain keep working.
      # The Android build is untouched — Capacitor still bundles dist/ directly.
      - name: Assemble site (landing + app)
        run: |
          rm -rf site-dist
          mkdir -p site-dist/app
          cp -r site/. site-dist/
          cp -r dist/. site-dist/app/
          cp dist/privacy.html site-dist/privacy.html
          cp dist/CNAME site-dist/CNAME
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
